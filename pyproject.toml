[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azad-type"
version = "0.1.0"
description = "An offline Persian/English typing utility"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Azad Type contributors"}]
dependencies = []

[project.scripts]
azad-type = "azad_type.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

